[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sufleur-cli"
version = "0.0.0"
description = "CLI for sufleur — type-safe codegen for versioned LLM prompts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["sufleur", "cli", "llm", "prompts", "codegen", "python"]
authors = [{ name = "Tamás Vajda" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Go",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
generated = ["chevron", "pydantic"]

[project.urls]
Homepage = "https://github.com/WTomas/sufleur-cli"
Issues = "https://github.com/WTomas/sufleur-cli/issues"
Repository = "https://github.com/WTomas/sufleur-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/sufleur_cli"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

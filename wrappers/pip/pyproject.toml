[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sufleur-cli"
dynamic = ["version"]
description = "CLI for sufleur — type-safe codegen for versioned LLM prompts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["sufleur", "cli", "llm", "prompts", "codegen", "python"]
authors = [{ name = "Tamás Vajda" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Go",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
generated = ["chevron", "pydantic", "typing_extensions>=4.0"]

[project.urls]
Homepage = "https://github.com/sufleur/cli"
Issues = "https://github.com/sufleur/cli/issues"
Repository = "https://github.com/sufleur/cli"

[tool.hatch.version]
path = "src/sufleur_cli/__init__.py"
# Allow non-monotonic bumps so `make release-dry VERSION=X.Y.Z.devN` still works
# after a real release has committed a higher version (e.g. 0.1.0 → 0.1.1.dev1).
validate-bump = false

[tool.hatch.build.targets.wheel]
packages = ["src/sufleur_cli"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

version: 2

# Drives both the archive prefix and (more importantly) the dist/ build ID prefix
# that wrappers/pip/hatch_build.py reads. Without this, goreleaser falls back to
# the working-directory name ("sufleur-cli") and the pip hook can't find binaries.
project_name: sufleur

builds:
  - main: ./cmd/sufleur
    binary: sufleur
    ldflags:
      - -X github.com/sufleur/cli/internal/cli.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Pinned so the dist/ subdirs (sufleur_<os>_<arch>_v1, _v8.0) stay stable
    # across goreleaser versions — wrappers/pip/hatch_build.py reads these paths.
    goamd64:
      - v1
    goarm64:
      - v8.0

archives:
  - formats: [tar.gz]
    name_template: "sufleur_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# Lets `make release-local VERSION=X` set SUFLEUR_LOCAL_VERSION so the snapshot
# archives are named sufleur_X_<os>_<arch>.<ext> instead of the default
# 0.0.0-SNAPSHOT-<sha>. Needed because the npm wrapper's install.js builds URLs
# from the package version, and the local-mirror test in scripts/verify-local-npm.sh
# expects archive filenames matching the user-supplied VERSION.
snapshot:
  version_template: '{{ if index .Env "SUFLEUR_LOCAL_VERSION" }}{{ .Env.SUFLEUR_LOCAL_VERSION }}{{ else }}{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}{{ end }}'

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
